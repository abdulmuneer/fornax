[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fornax-engine"
version = "0.1.0"
description = "Executable contracts and planner for heterogeneous MAX model serving"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Fornax contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
fornax = "fornax.cli:main"

[tool.setuptools.packages.find]
include = ["fornax*"]

[tool.setuptools.package-data]
fornax = [
  "golden_plans/*.json",
  "golden_plans/*.md",
  "golden_vectors/**/*.json",
  "golden_vectors/**/*.jsonl",
  "qualification_catalog/*.json",
  "qualification_catalog/**/*.json",
]
